<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f2fe'><path d='M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 14.59V8a1 1 0 0 0-2 0v8.59l-2.29-2.3a1 1 0 0 0-1.42 1.42l4 4a1 1 0 0 0 1.42 0l4-4a1 1 0 0 0-1.42-1.42z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0b0f19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniDownloader" />
    <meta name="application-name" content="OmniDownloader" />
    
    <!-- Web App Manifest & Apple Touch Icon -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    
    <title>OmniDownloader - Multiplatform Video & Audio Downloader</title>
    <meta name="description" content="Aplikasi mobile PWA untuk download video & audio dari YouTube, TikTok (No Watermark), Instagram Reels, X/Twitter, dan Facebook." />
  </head>
  <body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-cyan-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker terdaftar dengan scope:', reg.scope))
            .catch((err) => console.warn('[PWA] Service Worker gagal mendaftar:', err));
        });
      }
    </script>
  </body>
</html>
